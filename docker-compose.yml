services:
  scriber:
    build: .
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /data
      # Required. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or the environment}
      # Optional — leave unset to hide Google sign-in.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      # Accounts, uploaded papers and practice sessions live here.
      - scriber-data:/data
    restart: unless-stopped

volumes:
  scriber-data:
