# Fly.io deployment. Suits Scriber because it offers a persistent volume, a
# single always-on process, and automatic TLS on a custom domain.
#
#   fly launch --no-deploy --copy-config    # first time only
#   fly volumes create scriber_data --size 3 --region syd
#   fly secrets set JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
#   fly deploy
#   fly certs add scriber.example.com

app = 'scriber'
primary_region = 'syd'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DATA_DIR = '/data'

[[mounts]]
  source = 'scriber_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite and the uploaded papers are on a local volume, so this app runs as a
  # single machine that stays up. Do not scale it past one without moving the
  # database off the volume first.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
