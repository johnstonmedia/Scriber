# Render deployment (Static Site — free tier, custom domain and TLS included).
#
# Render → New → Blueprint, point it at this repo. Then add the VITE_FIREBASE_*
# values under the service's Environment settings; they are public web-app keys,
# but keeping them out of the repo lets you point the same source at a
# different Firebase project.
services:
  - type: web
    name: scriber
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      # Client-side routing: serve the app for any path that is not a real file.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
